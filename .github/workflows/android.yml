name: Build Android APK

# Builds the signed release APK on GitHub's servers (no local machine needed) and publishes it to
# a GitHub Release you can download+install directly on your phone. It is signed with the release
# key from GitHub Secrets; the build fails if those secrets are missing (never the debug key).
# Third-party actions are pinned to exact commits so a moved tag can't change what runs here.

on:
  push:
    branches: [main, feature/android-phase2]
  workflow_dispatch: # allows manual "Run workflow" from the Actions tab

permissions:
  contents: write # needed to publish the Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          # The action's default also installs the legacy "tools" package, which current
          # runners' SDK no longer has (sdkmanager fails: "Failed to find package 'tools'").
          packages: platform-tools

      - name: Install required SDK packages (compileSdk 36)
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install dependencies (runs postinstall patches)
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build web and sync to Android
        run: |
          npm run build
          npx cap sync android

      - name: Decode release keystore (from GitHub Secrets)
        env:
          KS: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          # No fallback to the committed debug key: a release must be signed with the release key.
          if [ -z "$KS" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is missing — refusing to build an APK signed with the public debug key."
            exit 1
          fi
          echo "$KS" | base64 -d > android/greetings-release.keystore

      - name: Build signed release APK (release key)
        env:
          RSP: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RKA: ${{ secrets.RELEASE_KEY_ALIAS }}
          RKP: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ARGS="-PversionCode=${{ github.run_number }} -PversionName=1.0.${{ github.run_number }}"
          ARGS="$ARGS -PRELEASE_STORE_FILE=../greetings-release.keystore -PRELEASE_STORE_PASSWORD=$RSP -PRELEASE_KEY_ALIAS=$RKA -PRELEASE_KEY_PASSWORD=$RKP"
          ./gradlew assembleRelease --console=plain $ARGS

      - name: Stage APK
        run: cp android/app/build/outputs/apk/release/app-release.apk greetings.apk

      - name: Publish to "android-latest" Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: android-latest
          name: "Build ${{ github.run_number }}"
          body: "Signed release APK · build ${{ github.run_number }} · ${{ github.sha }} on ${{ github.ref_name }}."
          prerelease: false
          make_latest: "true"
          files: greetings.apk
