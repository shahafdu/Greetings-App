apply plugin: 'com.android.application'

android {
    namespace = "com.shahaf.greetings"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.shahaf.greetings"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // CI passes -PversionCode=<github run number>; local builds default to 1.
        versionCode project.hasProperty('versionCode') ? Integer.parseInt(project.property('versionCode').toString()) : 1
        versionName project.hasProperty('versionName') ? project.property('versionName').toString() : "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        // One committed keystore for both build types so local + CI builds share the SHA-1
        // registered in Google Cloud — keeping Google Sign-In working on every build.
        // The debug key is public (it is committed, password 'android'), so it must never sign a
        // release — anyone could then sign an "update" Android would install over the real app.
        debug {
            storeFile file('../greetings-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            // The real release key, passed by CI from GitHub Secrets. There is deliberately NO
            // fallback: without it a release build fails (see the check below) instead of being
            // silently signed with the public debug key.
            if (project.hasProperty('RELEASE_STORE_FILE')) {
                storeFile file(project.property('RELEASE_STORE_FILE'))
                storePassword project.property('RELEASE_STORE_PASSWORD')
                keyAlias project.property('RELEASE_KEY_ALIAS')
                keyPassword project.property('RELEASE_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// Refuse to build a release without the release signing key. Debug builds (Android Studio "Run",
// assembleDebug) are unaffected.
gradle.taskGraph.whenReady { graph ->
    def buildsRelease = graph.allTasks.any { it.project == project && it.name ==~ /(assemble|bundle|package|install)Release/ }
    if (buildsRelease && !project.hasProperty('RELEASE_STORE_FILE')) {
        throw new GradleException(
            'Release signing key missing: pass -PRELEASE_STORE_FILE, -PRELEASE_STORE_PASSWORD, ' +
            '-PRELEASE_KEY_ALIAS and -PRELEASE_KEY_PASSWORD (CI takes them from GitHub Secrets). ' +
            'Release builds are never signed with the committed debug key. Use a debug build for local testing.')
    }
}
